<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Overflowia.AI</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <!-- Efeito de Luz Fundo (Ambient Glow) -->
    <div class="ambient-glow" aria-hidden="true"></div>
    
    <div class="login-wrapper">
        <main class="login-box" role="main">
            
            <!-- Logotipo e Título -->
            <div class="login-brand">
                <div class="brand-icon-lg" aria-hidden="true"><i class="fas fa-brain"></i></div>
                <h2>Acesse sua Conta</h2>
            </div>

            <div class="login-header">
                <h3>Bem-vindo ao Overflowia.AI</h3>
                <p style="font-size: 13px; color: var(--text-secondary); margin-top: 5px;">Entre com seus dados para interagir no fórum e no chat RAG</p>
            </div>

            <!-- Formulário de Autenticação -->
            <form class="login-form" aria-label="Formulário de Acesso">
                
                <!-- Campo de E-mail -->
                <div class="input-group">
                    <label for="email">E-mail Institucional</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" placeholder="aluno@instituicao.edu.br" autocomplete="email" required>
                    </div>
                </div>

                <!-- Campo de Senha -->
                <div class="input-group">
                    <div class="label-row" style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="password">Senha</label>
                        <a href="#" onclick="alert('Dica do PFC: Utilize qualquer e-mail e senha para autenticação de teste.'); return false;" style="font-size: 12px; color: var(--accent-color); text-decoration: none;">Esqueceu a senha?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                </div>

                <!-- Botão Entrar -->
                <button type="submit" class="btn-login" id="btn-submit-login" style="margin-top: 10px;"> 
                    <span>Entrar no Sistema</span> <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </button>
                
                <div style="text-align: center; margin-top: 10px;">
                    <a href="index.html" style="font-size: 12.5px; color: var(--text-secondary); text-decoration: none; transition: 0.2s;">
                        <i class="fas fa-arrow-left"></i> Acessar como Visitante
                    </a>
                </div>
            </form>

        </main>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
